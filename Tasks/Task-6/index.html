<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Left Section -->
        <div class="left">
            <img src="blue laudary.png" alt="Laundry Machine">
        </div>


        <!-- Right Section -->
        <div class="right">

            <div class="login-form">

                <h1>Hello Again!</h1>

                <p class="welcome">
                    Welcome back! we missed you!
                </p>


                <label>Email</label>

                <input
                    type="email"
                    placeholder="EmailId@site.com"
                >


                <label>Password</label>

                <input
                    type="password"
                    placeholder="Password"
                >


                <a href="#" class="forgot">
                    Forgot Password
                </a>


                <button>
                    Login
                </button>


                <p class="register">
                    Not a member?
                    <a href="#">Register Now</a>
                </p>

            </div>

        </div>

    </div>

</body>
</html>
